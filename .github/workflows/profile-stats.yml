name: Generate Profile Stats

on:
  schedule:
    - cron: "0 0 * * *"   # runs daily at midnight UTC
  workflow_dispatch: {}
  push:
    branches:
      - main

jobs:
  generate-stats:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate stats SVG
        uses: cicirello/user-statistician@v2
        with:
          user-statistician-token: ${{ secrets.GITHUB_TOKEN }}
          image-file: profile-stats.svg
          repository: rashid-khan681/rashid-khan681
          plugin: languages, repositories, contributions

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile-stats.svg
          git diff --quiet && git diff --staged --quiet || git commit -m "Update profile stats SVG"
          git push
